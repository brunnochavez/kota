<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kota · Detalhe da Cotação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f8fc; --surface: #ffffff; --surface-2: #eef2f9; --surface-3: #e4eaf4;
    --border: #dbe3f0; --text: #16213a; --text-dim: #5c6b85; --text-faint: #94a1ba;
    --accent: #2f6fed; --accent-hover: #2558c4; --accent-soft: #e8f0fe; --accent-soft-text: #2558c4;
    --success: #16814f; --success-bg: #e4f7ee; --success-border: #a7e3c6;
    --danger: #c0362c; --danger-bg: #fdeeec; --danger-border: #f3b8b1;
    --warning: #92650a; --warning-bg: #fdf3dc; --warning-border: #f0d189;
    --shadow: 0 1px 2px rgba(20,30,60,0.05), 0 1px 8px rgba(20,30,60,0.04);
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --radius: 10px;
  }
  html[data-theme="dark"] {
    --bg: #0c1220; --surface: #131a2c; --surface-2: #1a2338; --surface-3: #212c46;
    --border: #283252; --text: #e7ecf7; --text-dim: #8e9bbd; --text-faint: #5a6688;
    --accent: #5b93ff; --accent-hover: #7aa6ff; --accent-soft: #1c2c52; --accent-soft-text: #a8c3ff;
    --success: #3ecf8e; --success-bg: #0f2b22; --success-border: #1e5040;
    --danger: #f28b82; --danger-bg: #35191a; --danger-border: #5c2c2c;
    --warning: #f0c05a; --warning-bg: #322a11; --warning-border: #5a4a1c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.28);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; transition: background 0.15s, color 0.15s; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 5px; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
  header .brand { font-weight: 700; font-size: 16px; }
  header .brand .tag { color: var(--text-dim); font-size: 12px; font-weight: 400; margin-left: 8px; }
  .theme-switch {
    display: flex; align-items: center; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 2px; gap: 2px; flex-shrink: 0;
  }
  .theme-switch button {
    width: 27px; height: 27px; border-radius: 7px; border: none; background: transparent;
    color: var(--text-faint); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .theme-switch button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
  .theme-switch button:hover:not(.active) { color: var(--text-dim); }
  .theme-switch svg { width: 14px; height: 14px; }

  main { max-width: 900px; margin: 0 auto; padding: 24px 32px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card h2 { font-size: 14.5px; margin: 0 0 12px; font-weight: 600; }
  .card h3 { font-size: 11.5px; margin: 0 0 8px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }

  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; font-weight: 500; }
  input, select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px 11px; border-radius: 7px; font-size: 13.5px; font-family: var(--sans); }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  button { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 7px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--sans); }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--surface-3); }
  button.danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
  button.success { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
  button.small { padding: 5px 10px; font-size: 12px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .inline-form { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .inline-form > div { flex: 1; min-width: 180px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 10px; border-bottom: 1px solid var(--surface-2); vertical-align: middle; }
  tr:hover td { background: var(--surface-2); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .num { text-align: right; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
  .badge-draft { background: var(--surface-3); color: var(--text-dim); } .badge-draft::before { background: var(--text-faint); }
  .badge-available { background: var(--success-bg); color: var(--success); } .badge-available::before { background: var(--success); }
  .badge-closed { background: var(--accent-soft); color: var(--accent-soft-text); } .badge-closed::before { background: var(--accent); }
  .badge-expired { background: var(--danger-bg); color: var(--danger); } .badge-expired::before { background: var(--danger); }

  .divider { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
  .empty { color: var(--text-faint); font-size: 13px; padding: 14px 0; text-align: center; }
  .violation-box, .tie-box { background: var(--warning-bg); border: 1px solid var(--warning-border); border-radius: 9px; padding: 14px; margin-bottom: 12px; }
  .violation-box h4, .tie-box h4 { margin: 0 0 8px; color: var(--warning); font-size: 13px; }

  #toast-wrap { position: fixed; top: 18px; right: 18px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
  .toast { padding: 12px 16px; border-radius: 9px; font-size: 13px; max-width: 380px; box-shadow: var(--shadow); }
  .toast.ok { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
  .toast.err { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
</style>
</head>
<body>

<div id="toast-wrap"></div>

<header>
  <div class="brand">kota <span class="tag">Detalhe da Cotação</span></div>
  <div class="theme-switch">
    <button data-theme-option="light" onclick="setTheme('light')" title="Modo claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button data-theme-option="dark" onclick="setTheme('dark')" title="Modo escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 0010.5 10.5z"/></svg></button>
  </div>
</header>

<main>
  <h1 id="qd-title">Cotação #—</h1>
  <div class="subtitle">Edição, publicação, fechamento e conferência de itens/lances deste lote.</div>

  <div class="card">
    <h3>Editar (grupo / prazo)</h3>
    <div class="inline-form">
      <div><label>Grupo</label><select id="qd-group"></select></div>
      <div><label>Prazo de expiração</label><input type="datetime-local" id="qd-expiration"></div>
      <button onclick="updateQuotation()">Salvar edição</button>
    </div>

    <div class="btn-row" style="margin-top:16px">
      <button class="success" onclick="publishQuotation()">Publicar (Rascunho → Disponível)</button>
      <button class="secondary" onclick="closeQuotation()">Fechar (calcular vencedores)</button>
      <a id="qd-pdf-link" href="#" target="_blank" style="display:none"><button class="secondary">Baixar PDF do resultado</button></a>
    </div>

    <div id="close-flow"></div>
  </div>

  <div class="card">
    <h2>Itens do lote</h2>
    <table><thead><tr><th>Barcode</th><th>Produto</th><th>Qtd.</th><th>Lance vencedor</th><th></th></tr></thead>
      <tbody id="qd-items-tbody"></tbody></table>
  </div>

  <div class="card" id="item-bids-panel" style="display:none">
    <h2 id="item-bids-title">Lances recebidos</h2>
    <table><thead><tr><th>Fornecedor</th><th>Valor unit.</th><th>Prazo (dias)</th><th>Obs.</th></tr></thead>
      <tbody id="item-bids-tbody"></tbody></table>
  </div>
</main>

<script>
const API = '';
const params = new URLSearchParams(window.location.search);
const quotationId = params.get('id');

const STATUS_LABELS = { DRAFT: 'Rascunho', AVAILABLE: 'Disponível', CLOSED: 'Fechada', EXPIRED: 'Expirada' };
const STATUS_CLASSES = { DRAFT: 'draft', AVAILABLE: 'available', CLOSED: 'closed', EXPIRED: 'expired' };

let closeState = { tieBreakWinners: {}, excludedSupplierIds: [], acceptedViolationSupplierIds: [] };

// ---------- theme ----------
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.themeOption === theme);
  });
}
function setTheme(theme) { applyTheme(theme); }
applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

function toast(msg, isErr) {
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast ' + (isErr ? 'err' : 'ok');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || ('Erro HTTP ' + res.status));
  return data;
}

async function safeCall(fn) {
  try { return await fn(); }
  catch (e) { toast(e.message, true); throw e; }
}

function fmtDate(iso) { return iso ? iso.substring(0, 16) : ''; }

function statusBadge(status) {
  return `<span class="badge badge-${STATUS_CLASSES[status] || 'draft'}">${STATUS_LABELS[status] || status}</span>`;
}

async function init() {
  if (!quotationId) {
    document.body.innerHTML = '<main><div class="card">Nenhum ID de cotação informado na URL.</div></main>';
    return;
  }
  const groups = await safeCall(() => api('GET', '/supplier-groups'));
  document.getElementById('qd-group').innerHTML = '<option value="">— nenhum —</option>' +
    groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');

  await loadQuotation();
}

async function loadQuotation() {
  const q = await safeCall(() => api('GET', `/quotations/${quotationId}`));
  document.getElementById('qd-title').innerHTML = `Cotação #${q.id} ${statusBadge(q.status)}`;
  document.getElementById('qd-group').value = q.supplierGroupId || '';
  document.getElementById('qd-expiration').value = fmtDate(q.expirationDate);

  const pdfLink = document.getElementById('qd-pdf-link');
  if (q.status === 'CLOSED') {
    pdfLink.href = `/quotations/${quotationId}/result-pdf`;
    pdfLink.style.display = 'inline-block';
  } else {
    pdfLink.style.display = 'none';
  }

  await loadQuotationItems();
}

async function loadQuotationItems() {
  const items = await safeCall(() => api('GET', `/quotations/${quotationId}/items`));
  const tbody = document.getElementById('qd-items-tbody');
  tbody.innerHTML = '';
  items.forEach(it => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="mono">${it.productBarcode}</td><td>${it.productName}</td>
      <td class="num">${it.quantity}</td><td>${it.winningBidId ? '#' + it.winningBidId : '—'}</td>
      <td><button class="secondary small" onclick="showItemBids(${it.id}, '${it.productName.replace(/'/g, "\\'")}')">Ver lances</button></td>`;
    tbody.appendChild(tr);
  });
}

async function showItemBids(itemId, productName) {
  const bids = await safeCall(() => api('GET', `/bids?quotationItemId=${itemId}`));
  document.getElementById('item-bids-panel').style.display = 'block';
  document.getElementById('item-bids-title').textContent = `Lances recebidos — ${productName}`;
  const tbody = document.getElementById('item-bids-tbody');
  tbody.innerHTML = bids.length
    ? bids.map(b => `<tr><td>${b.supplierName}</td><td class="num">R$ ${b.value}</td><td class="num">${b.deliveryDeadlineDays}</td><td>${b.notes || '—'}</td></tr>`).join('')
    : '<tr><td colspan="4" class="empty">Nenhum lance recebido ainda.</td></tr>';
  document.getElementById('item-bids-panel').scrollIntoView({ behavior: 'smooth' });
}

async function updateQuotation() {
  const body = {
    supplierGroupId: document.getElementById('qd-group').value || null,
    expirationDate: document.getElementById('qd-expiration').value || null
  };
  await safeCall(() => api('PUT', `/quotations/${quotationId}`, body));
  toast('Cotação atualizada.');
  loadQuotation();
}

async function publishQuotation() {
  await safeCall(() => api('POST', `/quotations/${quotationId}/publish`));
  toast('Cotação publicada.');
  loadQuotation();
}

async function closeQuotation() {
  const result = await safeCall(() => api('POST', `/quotations/${quotationId}/close`, closeState));
  renderCloseFlow(result);
}

function renderCloseFlow(result) {
  const box = document.getElementById('close-flow');

  if (result.closed) {
    box.innerHTML = `<div class="card" style="border-color:var(--success-border); margin-top:16px">
      <h2 style="color:var(--success)">Cotação fechada com sucesso.</h2>
      <div class="subtitle">Todos os vencedores foram definidos. Baixe o PDF do resultado acima.</div>
    </div>`;
    loadQuotation();
    return;
  }

  let html = '';

  if (result.pendingTieBreaks && result.pendingTieBreaks.length) {
    html += '<div class="card" style="margin-top:16px"><h2>Empates a resolver</h2>';
    result.pendingTieBreaks.forEach(tie => {
      html += `<div class="tie-box"><h4>${tie.productName}</h4>`;
      tie.tiedBids.forEach(b => {
        html += `<label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer">
          <input type="radio" name="tie-${tie.quotationItemId}" style="width:auto" onclick="setTieWinner(${tie.quotationItemId}, ${b.id})">
          ${b.supplierName} — R$ ${b.value} (${b.deliveryDeadlineDays} dias)
        </label>`;
      });
      html += '</div>';
    });
    html += '<button onclick="closeQuotation()">Reenviar com desempates escolhidos</button></div>';
  }

  if (result.pendingViolations && result.pendingViolations.length) {
    html += '<div class="card" style="margin-top:16px"><h2>Fornecedores abaixo do pedido mínimo</h2>';
    result.pendingViolations.forEach(v => {
      html += `<div class="violation-box"><h4>${v.supplierName}</h4>
        <div>Total ganho: R$ ${v.total} — Pedido mínimo: R$ ${v.minimumOrderValue}</div>
        <div style="margin:8px 0; font-size:12.5px; color:var(--text-dim)">Produtos: ${v.wonItems.map(i => i.productName).join(', ')}</div>
        <div class="btn-row">
          <button class="danger small" onclick="excludeSupplier(${v.supplierId})">Excluir fornecedor</button>
          <button class="secondary small" onclick="acceptViolation(${v.supplierId})">Aceitar mesmo assim</button>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  box.innerHTML = html;
}

function setTieWinner(itemId, bidId) {
  closeState.tieBreakWinners[itemId] = bidId;
}
function excludeSupplier(id) {
  if (!closeState.excludedSupplierIds.includes(id)) closeState.excludedSupplierIds.push(id);
  closeQuotation();
}
function acceptViolation(id) {
  if (!closeState.acceptedViolationSupplierIds.includes(id)) closeState.acceptedViolationSupplierIds.push(id);
  closeQuotation();
}

init();
</script>
</body>
</html>
