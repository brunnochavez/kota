<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kota · Painel do Representante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f8fc; --surface: #ffffff; --surface-2: #eef2f9; --surface-3: #e4eaf4;
    --border: #dbe3f0; --text: #16213a; --text-dim: #5c6b85; --text-faint: #94a1ba;
    --accent: #2f6fed; --accent-hover: #2558c4; --accent-soft: #e8f0fe; --accent-soft-text: #2558c4;
    --success: #16814f; --success-bg: #e4f7ee; --success-border: #a7e3c6;
    --danger: #c0362c; --danger-bg: #fdeeec; --danger-border: #f3b8b1;
    --warning: #92650a; --warning-bg: #fdf3dc; --warning-border: #f0d189;
    --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20,30,60,0.05), 0 1px 8px rgba(20,30,60,0.04);
  }
  html[data-theme="dark"] {
    --bg: #0c1220; --surface: #131a2c; --surface-2: #1a2338; --surface-3: #212c46;
    --border: #283252; --text: #e7ecf7; --text-dim: #8e9bbd; --text-faint: #5a6688;
    --accent: #5b93ff; --accent-hover: #7aa6ff; --accent-soft: #1c2c52; --accent-soft-text: #a8c3ff;
    --success: #3ecf8e; --success-bg: #0f2b22; --success-border: #1e5040;
    --danger: #f28b82; --danger-bg: #35191a; --danger-border: #5c2c2c;
    --warning: #f0c05a; --warning-bg: #322a11; --warning-border: #5a4a1c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.28);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; transition: background 0.15s, color 0.15s; }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 5px; }
  *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 20px; position: sticky; top: 0; z-index: 10; }
  header .row { display: flex; align-items: center; justify-content: space-between; max-width: 900px; margin: 0 auto; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .brand .tag { color: var(--text-dim); font-size: 11.5px; font-weight: 400; margin-left: 6px; }
  .whoami { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .whoami label { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  .whoami select { max-width: 190px; width: auto; }
  .theme-switch {
    display: flex; align-items: center; background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 9px; padding: 2px; gap: 2px; flex-shrink: 0;
  }
  .theme-switch button {
    width: 27px; height: 27px; border-radius: 7px; border: none; background: transparent;
    color: var(--text-faint); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .theme-switch button.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
  .theme-switch button:hover:not(.active) { color: var(--text-dim); }
  .theme-switch svg { width: 14px; height: 14px; }

  main { max-width: 900px; margin: 0 auto; padding: 20px 20px 100px; }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 700; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }

  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; font-weight: 500; }
  input, select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 8px 11px; border-radius: 7px; font-size: 13.5px; font-family: var(--sans);
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--sans); }
  button:hover { background: var(--accent-hover); }
  button.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  button.small { padding: 5px 10px; font-size: 12px; }

  .quote-list { display: flex; flex-direction: column; gap: 8px; }
  .quote-item {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
    cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .quote-item:hover { border-color: var(--accent); box-shadow: var(--shadow); }
  .quote-item.selected { border-color: var(--accent); background: var(--accent-soft); }
  .quote-item-icon {
    width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .quote-item-icon svg { width: 17px; height: 17px; }
  .quote-item-main { flex: 1; min-width: 0; }
  .quote-item-name { font-weight: 700; font-size: 13.5px; }
  .quote-item-meta { font-size: 11.5px; color: var(--text-dim); margin-top: 1px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
  .badge-available { background: var(--success-bg); color: var(--success); } .badge-available::before { background: var(--success); }
  .badge-draft, .badge-closed, .badge-expired { background: var(--surface-3); color: var(--text-dim); } .badge-draft::before, .badge-closed::before, .badge-expired::before { background: var(--text-faint); }

  .supplier-info-line { font-size: 13px; padding: 9px 12px; background: var(--accent-soft); color: var(--accent-soft-text); border-radius: 8px; margin-bottom: 12px; }
  .supplier-warning { font-size: 13px; padding: 9px 12px; background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); border-radius: 8px; margin-bottom: 12px; }
  .deadline-info-line { font-size: 12.5px; color: var(--text-dim); margin-bottom: 12px; }
  .deadline-countdown { font-size: 13px; font-weight: 700; color: var(--warning); background: var(--warning-bg); border: 1px solid var(--warning-border); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }
  .deadline-expired { font-size: 12.5px; color: var(--danger); margin-bottom: 12px; }
  .item-row-sent { font-size: 11px; color: var(--success); font-weight: 700; white-space: nowrap; flex-shrink: 0; }

  .item-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px;
  }
  .item-row-barcode { font-family: var(--mono); font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
  .item-row-name { font-weight: 600; font-size: 13px; flex: 1; min-width: 130px; }
  .item-row-qty { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; flex-shrink: 0; }
  .item-row-price { width: 100px; flex-shrink: 0; padding: 7px 9px; font-size: 13px; margin: 0; }
  .mono { font-family: var(--mono); }
  .empty { color: var(--text-faint); text-align: center; padding: 22px 10px; font-size: 13px; }

  #sticky-submit-bar {
    display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 12px 20px; box-shadow: 0 -6px 16px rgba(0,0,0,0.06); justify-content: center;
  }
  #sticky-submit-bar button { width: 100%; max-width: 860px; padding: 12px 16px; font-size: 14px; }

  #toast-wrap { position: fixed; top: 18px; right: 18px; z-index: 999; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 36px); }
  .toast { padding: 12px 16px; border-radius: 9px; font-size: 13px; max-width: 380px; box-shadow: var(--shadow); }
  .toast.ok { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
  .toast.err { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }

  @media (max-width: 480px) {
    header { padding: 12px 14px; }
    main { padding: 16px 14px 100px; }
    .card { padding: 14px; }
    .item-row-price { width: 88px; }
  }
</style>
</head>
<body>

<div id="toast-wrap"></div>

<header>
  <div class="row">
    <div class="brand">kota <span class="tag">Painel do Representante</span></div>
    <div class="whoami">
      <label>Logado como (simulado):</label>
      <select id="who-representative" onchange="onRepresentativeChange()"></select>
      <div class="theme-switch">
        <button data-theme-option="light" onclick="setTheme('light')" title="Modo claro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button data-theme-option="dark" onclick="setTheme('dark')" title="Modo escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 0010.5 10.5z"/></svg></button>
      </div>
    </div>
  </div>
</header>

<main>
  <h1>Cotações</h1>
  <div class="subtitle">Sem autenticação ainda — escolha seu usuário simulado acima. Só aparecem cotações já publicadas.</div>

  <div class="card">
    <h2>Cotações disponíveis</h2>
    <div class="quote-list" id="quote-list"></div>
    <div class="empty" id="quote-list-empty" style="display:none">Nenhuma cotação encontrada.</div>
  </div>

  <div id="items-section" style="display:none">
    <div class="card">
      <h2 id="items-title">Itens da cotação</h2>
      <div id="quotation-deadline-info"></div>

      <div id="rep-supplier-info"></div>

      <div style="max-width:200px; margin-bottom:14px">
        <label>Prazo de entrega (dias)</label>
        <input type="number" id="global-bid-deadline" placeholder="Ex: 5">
      </div>

      <div id="items-list"></div>
    </div>
  </div>
</main>

<div id="sticky-submit-bar">
  <button onclick="submitAllBids()">Salvar Cotação</button>
</div>

<script>
const API = '';

// ---------- theme ----------
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.querySelectorAll('.theme-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.themeOption === theme);
  });
}
function setTheme(theme) { applyTheme(theme); }
applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

function toast(msg, isErr) {
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast ' + (isErr ? 'err' : 'ok');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(API + path, opts);
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || ('Erro HTTP ' + res.status));
  return data;
}

async function safeCall(fn) {
  try { return await fn(); }
  catch (e) { toast(e.message, true); throw e; }
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function maskCurrencyInput(raw) {
  let d = (raw || '').replace(/\D/g, '');
  if (!d) return '';
  d = d.replace(/^0+(?=\d)/, '');
  while (d.length < 3) d = '0' + d;
  const cents = d.slice(-2);
  let intPart = d.slice(0, -2);
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return intPart + ',' + cents;
}
function unmaskCurrencyToNumber(value) {
  if (!value) return null;
  const normalized = String(value).replace(/\./g, '').replace(',', '.');
  const n = parseFloat(normalized);
  return isNaN(n) ? null : n;
}
function formatCurrencyFromNumber(n) {
  if (n === null || n === undefined || n === '') return '';
  const parts = Number(n).toFixed(2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return parts[0] + ',' + parts[1];
}

const STATUS_LABELS = { DRAFT: 'Rascunho', AVAILABLE: 'Disponível', CLOSED: 'Fechada', EXPIRED: 'Expirada' };

function statusBadge(status) {
  const map = { DRAFT: 'draft', AVAILABLE: 'available', CLOSED: 'closed', EXPIRED: 'expired' };
  return `<span class="badge badge-${map[status] || 'draft'}">${STATUS_LABELS[status] || status}</span>`;
}

let representativesCache = [];
let suppliersCache = [];
let quotationsCache = [];
let currentQuotationId = null;

async function init() {
  representativesCache = await safeCall(() => api('GET', '/representatives'));
  suppliersCache = await safeCall(() => api('GET', '/suppliers'));
  const sel = document.getElementById('who-representative');
  sel.innerHTML = representativesCache.map(r => `<option value="${r.id}">${r.name}</option>`).join('');

  await loadQuotations();
}

// Trocar de representante muda quem "é" quem — refaz o carregamento dos itens do zero,
// pro contexto (fornecedor resolvido, lances já enviados) do novo representante.
function onRepresentativeChange() {
  if (currentQuotationId) loadItemsForCurrentQuotation();
}

const QUOTE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l5 5v13a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M9 12h6M9 16h6M9 8h2"/></svg>';

async function loadQuotations() {
  const all = await safeCall(() => api('GET', '/quotations'));
  // Só cotações já publicadas — Rascunho nunca teve o "publicar" apertado, então
  // nenhum representante deveria estar vendo ela ainda.
  // Rascunho nunca foi publicada, e Em Revisão é o meio-tempo entre calcular vencedores
  // e o admin confirmar de vez — em nenhum dos dois o representante deveria estar vendo.
  quotationsCache = all.filter(q => q.status !== 'DRAFT' && q.status !== 'REVIEWING');

  const list = document.getElementById('quote-list');
  list.innerHTML = '';
  document.getElementById('quote-list-empty').style.display = quotationsCache.length ? 'none' : 'block';
  quotationsCache.forEach(q => {
    const div = document.createElement('div');
    div.className = 'quote-item';
    div.innerHTML = `
      <div class="quote-item-icon">${QUOTE_ICON}</div>
      <div class="quote-item-main">
        <div class="quote-item-name">${escapeHtml(q.name)}</div>
        <div class="quote-item-meta">${q.supplierGroupName || 'sem grupo'}</div>
      </div>
      ${statusBadge(q.status)}
    `;
    div.onclick = () => selectQuotation(q.id, div);
    list.appendChild(div);
  });
}

// O representante logado já diz quem ele é — não faz sentido pedir pra escolher o
// fornecedor de novo. Resolve automaticamente a partir de quem está em "Logado como".
function getMySuppliers() {
  const repId = parseInt(document.getElementById('who-representative').value);
  return suppliersCache.filter(s => s.representativeId === repId);
}

function renderSupplierResolution() {
  const mySuppliers = getMySuppliers();
  const wrap = document.getElementById('rep-supplier-info');
  if (mySuppliers.length === 0) {
    wrap.innerHTML = `<div class="supplier-warning">Este representante não está associado a nenhum fornecedor — fale com o administrador antes de enviar lances.</div>`;
  } else if (mySuppliers.length === 1) {
    wrap.innerHTML = `<div class="supplier-info-line">Enviando lances como <strong>${escapeHtml(mySuppliers[0].name)}</strong></div>`;
  } else {
    wrap.innerHTML = `
      <div style="max-width:260px; margin-bottom:12px">
        <label>Fornecedor</label>
        <select id="global-bid-supplier" onchange="loadItemsForCurrentQuotation()">${mySuppliers.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')}</select>
      </div>`;
  }
}

function resolveSupplierId() {
  const mySuppliers = getMySuppliers();
  if (mySuppliers.length === 1) return mySuppliers[0].id;
  if (mySuppliers.length > 1) {
    const sel = document.getElementById('global-bid-supplier');
    return sel && sel.value ? parseInt(sel.value) : null;
  }
  return null;
}

// ---------- prazo de expiração da cotação, com contagem regressiva na última hora ----------
let deadlineCountdownInterval = null;

function fmtDateTime(iso) {
  return new Date(iso).toLocaleString('pt-BR');
}

function renderDeadlineInfo(expirationDate) {
  clearInterval(deadlineCountdownInterval);
  const wrap = document.getElementById('quotation-deadline-info');
  if (!expirationDate) { wrap.innerHTML = ''; return; }

  function update() {
    const diffMs = new Date(expirationDate) - new Date();

    if (diffMs <= 0) {
      wrap.innerHTML = `<div class="deadline-expired">Prazo encerrado em ${fmtDateTime(expirationDate)}</div>`;
      clearInterval(deadlineCountdownInterval);
      return;
    }

    if (diffMs < 60 * 60 * 1000) {
      const mins = Math.floor(diffMs / 60000);
      const secs = Math.floor((diffMs % 60000) / 1000);
      wrap.innerHTML = `<div class="deadline-countdown">Fecha em ${mins}min ${String(secs).padStart(2, '0')}s — ${fmtDateTime(expirationDate)}</div>`;
    } else {
      wrap.innerHTML = `<div class="deadline-info-line">Fecha em ${fmtDateTime(expirationDate)}</div>`;
    }
  }

  update();
  deadlineCountdownInterval = setInterval(update, 1000);
}

// Carrega (ou recarrega) os itens da cotação atualmente aberta — usada tanto ao
// selecionar a cotação quanto ao trocar de representante/fornecedor, pra garantir que
// os campos sempre reflitam o contexto certo, nunca o de quem preencheu antes.
async function loadItemsForCurrentQuotation() {
  if (!currentQuotationId) return;

  const q = quotationsCache.find(x => x.id === currentQuotationId);
  renderDeadlineInfo(q ? q.expirationDate : null);

  const supplierId = resolveSupplierId();
  const items = await safeCall(() => api('GET', `/quotations/${currentQuotationId}/items`));

  // Busca se já existe lance desse fornecedor pra cada item, pra pré-preencher —
  // sem isso, o representante não tem como saber se já cotou aquele produto ou não.
  const rows = await Promise.all(items.map(async item => {
    let existingBid = null;
    if (supplierId) {
      const bids = await safeCall(() => api('GET', `/bids?quotationItemId=${item.id}`));
      existingBid = bids.find(b => b.supplierId === supplierId) || null;
    }
    return { item, existingBid };
  }));

  const wrap = document.getElementById('items-list');
  wrap.innerHTML = '';
  rows.forEach(({ item, existingBid }) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    const prefill = existingBid ? formatCurrencyFromNumber(existingBid.value) : '';
    row.innerHTML = `
      <span class="item-row-barcode">${item.productBarcode}</span>
      <span class="item-row-name">${escapeHtml(item.productName)}</span>
      <span class="item-row-qty">Qtd: ${item.quantity}</span>
      ${existingBid ? '<span class="item-row-sent">✓ Enviado</span>' : ''}
      <input type="text" inputmode="decimal" class="item-row-price" id="bid-price-${item.id}" placeholder="0,00" value="${prefill}" oninput="this.value = maskCurrencyInput(this.value)">
    `;
    wrap.appendChild(row);
  });

  const firstExisting = rows.find(r => r.existingBid);
  document.getElementById('global-bid-deadline').value = firstExisting ? firstExisting.existingBid.deliveryDeadlineDays : '';
}

async function selectQuotation(id, el) {
  currentQuotationId = id;
  document.querySelectorAll('.quote-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');

  const q = quotationsCache.find(x => x.id === id);
  document.getElementById('items-title').textContent = q ? q.name : 'Itens da cotação';

  renderSupplierResolution();
  document.getElementById('items-section').style.display = 'block';
  document.getElementById('sticky-submit-bar').style.display = 'flex';

  await loadItemsForCurrentQuotation();
}

// Um único envio pro lote inteiro — fornecedor resolvido automaticamente e prazo
// preenchido uma vez, aplicados a todo item que tiver preço digitado.
async function submitAllBids() {
  const supplierId = resolveSupplierId();
  const deadline = document.getElementById('global-bid-deadline').value;
  const submittedById = document.getElementById('who-representative').value;

  if (!supplierId) { toast('Não foi possível identificar o fornecedor deste representante.', true); return; }
  if (!deadline) { toast('Informe o prazo de entrega.', true); return; }

  const priceInputs = document.querySelectorAll('[id^="bid-price-"]');
  const toSubmit = [];
  priceInputs.forEach(input => {
    const value = unmaskCurrencyToNumber(input.value);
    if (value != null && value > 0) {
      toSubmit.push({ itemId: input.id.replace('bid-price-', ''), value });
    }
  });

  if (!toSubmit.length) { toast('Preencha o preço de pelo menos um item.', true); return; }

  const requests = toSubmit.map(({ itemId, value }) => api('POST', '/bids', {
    quotationItemId: parseInt(itemId),
    supplierId,
    submittedById: parseInt(submittedById),
    value,
    deliveryDeadlineDays: parseInt(deadline),
    notes: null
  }));

  await safeCall(() => Promise.all(requests));
  toast('Cotação salva com sucesso.');
  closeItemsView();
}

// Volta pra lista de cotações — fecha a tela de digitação, some com o botão fixo,
// desmarca a cotação selecionada.
function closeItemsView() {
  document.getElementById('items-section').style.display = 'none';
  document.getElementById('sticky-submit-bar').style.display = 'none';
  document.querySelectorAll('.quote-item').forEach(e => e.classList.remove('selected'));
  currentQuotationId = null;
  clearInterval(deadlineCountdownInterval);
}

init();
</script>
</body>
</html>
