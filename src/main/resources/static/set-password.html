<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Definir senha — easyKota</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f8fc; --surface: #ffffff; --surface-2: #eef2f9;
    --border: #dbe3f0; --text: #16213a; --text-dim: #5c6b85; --text-faint: #94a1ba;
    --accent: #2f6fed; --accent-hover: #2558c4;
    --danger: #c0362c; --danger-bg: #fdeeec; --danger-border: #f3b8b1;
    --success: #16814f; --success-bg: #e4f7ee; --success-border: #a7e3c6;
    --shadow: 0 1px 2px rgba(20,30,60,0.05), 0 1px 8px rgba(20,30,60,0.04);
    --sans: 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  html[data-theme="dark"] {
    --bg: #0c1220; --surface: #131a2c; --surface-2: #1a2338;
    --border: #283252; --text: #e7ecf7; --text-dim: #8e9bbd; --text-faint: #5a6688;
    --accent: #5b93ff; --accent-hover: #7aa6ff;
    --danger: #f28b82; --danger-bg: #35191a; --danger-border: #5c2c2c;
    --success: #3ecf8e; --success-bg: #0f2b22; --success-border: #1e5040;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.28);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px; box-shadow: var(--shadow);
  }
  .login-wrap { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; }
  .login-brand-banner { width: 100%; max-width: 260px; height: auto; margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .brand-logo-slot img { width: 34px; height: 34px; object-fit: contain; flex-shrink: 0; }
  .brand-name { font-weight: 700; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .subtitle { color: var(--text-dim); font-size: 13px; margin: 0 0 26px; }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14px; font-family: var(--sans);
    margin-bottom: 16px;
  }
  .password-field { position: relative; }
  .password-field input { padding-right: 42px; }
  .password-toggle {
    position: absolute; right: 2px; top: 0; bottom: 16px; width: 38px; height: auto;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; padding: 0; margin: 0; cursor: pointer; color: var(--text-faint);
  }
  .password-toggle:hover { color: var(--text-dim); background: none; }
  .password-toggle svg { width: 18px; height: 18px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--accent);
    color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: var(--sans);
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error-box {
    background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger);
    border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; display: none;
  }
  .success-icon {
    width: 52px; height: 52px; border-radius: 50%; background: var(--success-bg); color: var(--success);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
  }
  .center { text-align: center; }
</style>
</head>
<body>

<div class="login-wrap">
  <img src="/img/kota-wordmark.png" alt="kota" class="login-brand-banner">

  <!-- Formulário — estado inicial -->
  <div class="card" id="form-card">
    <div class="brand">
      <span class="brand-logo-slot"><img src="/img/kota-logo.png" alt="kota"></span>
      <span class="brand-name">kota</span>
    </div>
    <div class="subtitle" id="form-subtitle">Escolha a senha que você vai usar pra entrar no sistema.</div>

    <div class="error-box" id="error-box"></div>

    <form id="set-password-form">
      <label for="new-password">Nova senha</label>
      <div class="password-field">
        <input type="password" id="new-password" autocomplete="new-password" minlength="6" required>
        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('new-password', this)" title="Mostrar senha">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.8 21.8 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a21.8 21.8 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>

      <label for="confirm-password">Confirmar nova senha</label>
      <div class="password-field">
        <input type="password" id="confirm-password" autocomplete="new-password" minlength="6" required>
        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirm-password', this)" title="Mostrar senha">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" style="display:none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.8 21.8 0 015.06-5.94M9.9 4.24A10.94 10.94 0 0112 4c7 0 11 7 11 7a21.8 21.8 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>

      <button type="submit" id="submit-btn">Definir senha</button>
    </form>
  </div>

  <!-- Link ausente/inválido -->
  <div class="card center" id="invalid-card" style="display:none">
    <div class="brand" style="justify-content:center">
      <span class="brand-logo-slot"><img src="/img/kota-logo.png" alt="kota"></span>
      <span class="brand-name">kota</span>
    </div>
    <p style="color:var(--text-dim); margin:18px 0 22px">Esse link está incompleto ou não é válido. Peça um novo — no login, em "Esqueci minha senha".</p>
    <button onclick="window.location.href='/login.html'">Ir para o login</button>
  </div>

  <!-- Sucesso -->
  <div class="card center" id="success-card" style="display:none">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
    </div>
    <div class="brand" style="justify-content:center">
      <span class="brand-name" style="font-size:17px">Senha definida!</span>
    </div>
    <p style="color:var(--text-dim); margin:10px 0 22px">Já pode entrar no sistema com sua nova senha.</p>
    <button onclick="window.location.href='/login.html'">Ir para o login</button>
  </div>
</div>

<script>
applyTheme(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme(theme) { document.documentElement.setAttribute('data-theme', theme); }

const token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('form-card').style.display = 'none';
  document.getElementById('invalid-card').style.display = 'block';
}

// Nome/logo públicos (GET /company-settings) — mesma lógica do login.html, essa tela
// também roda antes de qualquer sessão existir.
(async function applyCompanyBranding() {
  try {
    const res = await fetch('/company-settings');
    if (!res.ok) return;
    const company = await res.json();
    if (company.name) {
      document.querySelectorAll('.brand-name').forEach(el => { if (!el.closest('#success-card')) { el.textContent = company.name; el.title = company.name; } });
    }
    if (company.logoUrl) {
      document.querySelectorAll('.brand-logo-slot').forEach(el => {
        el.innerHTML = `<img src="${company.logoUrl}?t=${Date.now()}" alt="">`;
      });
    }
  } catch (e) {
    // Sem conexão — mantém "kota" no HTML.
  }
})();

function togglePasswordVisibility(inputId, buttonEl) {
  const input = document.getElementById(inputId);
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  buttonEl.querySelector('.eye-open').style.display = isHidden ? 'none' : 'block';
  buttonEl.querySelector('.eye-closed').style.display = isHidden ? 'block' : 'none';
  buttonEl.title = isHidden ? 'Esconder senha' : 'Mostrar senha';
}

document.getElementById('set-password-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('error-box');
  const submitBtn = document.getElementById('submit-btn');
  errorBox.style.display = 'none';

  const newPassword = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('confirm-password').value;

  if (newPassword !== confirmPassword) {
    errorBox.textContent = 'As duas senhas precisam ser iguais.';
    errorBox.style.display = 'block';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Salvando...';

  try {
    const res = await fetch('/password-reset/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.message || 'Não foi possível definir a senha agora.');
    }

    document.getElementById('form-card').style.display = 'none';
    document.getElementById('success-card').style.display = 'block';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Definir senha';
  }
});
</script>

</body>
</html>
