spring.application.name=kota

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kota?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:kota123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chave usada pra assinar/validar o JWT ? TROQUE isso antes de ir pra produção, e nunca
# comite o valor real num repositório público. Ideal é vir de variável de ambiente
# (JWT_SECRET), não fixo aqui; o valor abaixo é só um placeholder de desenvolvimento.
jwt.secret=${JWT_SECRET:trocar-essa-chave-antes-de-produção-precisa-ter-pelo-menos-256-bits-de-tamanho}
jwt.expiration-hours=12

# Onde a logo da empresa fica salva em disco ? fora do classpath de propósito, já que
# arquivo empacotado dentro do .jar não pode ser escrito em tempo de execução.
app.upload-dir=${UPLOAD_DIR:./uploads}